name: Verify Windows sandbox pipes
on:
  push:
    branches: ['codex/windows-ci-pipe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare the pinned POSIX shell
        shell: pwsh
        run: |
          node --input-type=module -e "import {ensureWindowsPosixBundle} from './scripts/windows-posix.ts'; console.log((await ensureWindowsPosixBundle(process.cwd())).executable)"
      - name: Record token categories and native pipe results
        shell: pwsh
        run: node tests/fixtures/windows-pipe-diagnostics.mjs vendor/windows-posix/FRP-6075-g169694ebd/busybox-w64u-FRP-6075-g169694ebd.exe
      - run: npm run build:native-vault && npm run build:pixel-classroom
      - run: npm run typecheck && npm run typecheck:tests
      - run: npm run test:unit -- --testTimeout=30000
      - run: npm run test:plugins
      - name: Verify the real Windows sandbox and CLI
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts tests/integration/native-vault-git-bash.test.ts tests/integration/native-vault-memory.test.ts tests/integration/native-vault-teaching.test.ts tests/integration/native-vault-windows-shell.test.ts tests/integration/native-vault-windows-cli.test.ts tests/integration/native-vault-windows-pipe.test.ts
