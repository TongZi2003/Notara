name: Diagnose Windows sandbox pipes
on:
  push:
    branches: ['codex/windows-ci-pipe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare the pinned POSIX shell
        shell: pwsh
        run: |
          node --input-type=module -e "import {ensureWindowsPosixBundle} from './scripts/windows-posix.ts'; console.log((await ensureWindowsPosixBundle(process.cwd())).executable)"
      - name: Record token categories and native pipe results
        shell: pwsh
        run: node tests/fixtures/windows-pipe-diagnostics.mjs vendor/windows-posix/FRP-6075-g169694ebd/busybox-w64u-FRP-6075-g169694ebd.exe
