name: Verify release update fixtures

on:
  push:
    branches: ['main']
    paths:
      - 'tests/fixtures/vault-update-release.ts'
      - 'tests/integration/native-vault-updates.test.ts'
      - '.github/workflows/update-fixture-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-vault && npm run build:pixel-classroom
      - run: npm run typecheck:tests
      - name: Verify real DSH update, classroom continuity and startup rollback
        run: npm run test:integration -- tests/integration/native-vault-updates.test.ts
