name: Publish Notara release
on:
  push:
    tags: ['v*']
    branches: ['codex/release-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source: ${{ steps.release.outputs.source }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME#codex/release-}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/codex/release-v* ]]; then
            echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "source=$tag" >> "$GITHUB_OUTPUT"
          fi
  windows:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-vault && npm run build:pixel-classroom
      # These tests start real PowerShell ACL helpers; cold hosted runners can
      # exceed Vitest's 5 s default. Keep every assertion and a bounded deadline.
      - run: npm run test:unit -- --testTimeout=30000
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Verify archive pressure and interrupted cleanup on Windows
        run: node --test examples/native-vault/context-history-delete-pressure.test.js
        # Synthetic SQLite data belongs on runner scratch storage. A same-VM
        # comparison retains the 90k fixture/default 30 s deadline: 4.23 s here,
        # versus timeout on the Windows system temporary volume.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run test:plugins
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Test the real Windows sandbox and CLI
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts tests/integration/native-vault-git-bash.test.ts tests/integration/native-vault-memory.test.ts tests/integration/native-vault-teaching.test.ts tests/integration/native-vault-windows-shell.test.ts tests/integration/native-vault-windows-cli.test.ts tests/integration/native-vault-windows-pipe.test.ts
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Verify Unicode shortcuts, installer and start-stop
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts tests/integration/windows-shortcuts.test.ts tests/integration/windows-installer.test.ts tests/integration/vault-installer.test.ts
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Verify unexpected process recovery and saved classroom continuity
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts tests/integration/native-vault-recovery.test.ts
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Build the Windows x64 ready-to-run package
        run: npm run release:portable
      - name: Verify portable startup without system Node or Git
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $env:NOTARA_TEST_PORTABLE_ARCHIVE = (Get-ChildItem .runtime/portable-release/notara-portable-*-win-x64.zip).FullName
          node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts tests/integration/windows-portable.test.ts
      - name: Stage the verified Windows shell for release packaging
        shell: pwsh
        run: |
          @'
          import { cp, mkdir } from 'node:fs/promises';
          import { dirname, join } from 'node:path';
          import { ensureWindowsPosixBundle } from './scripts/windows-posix.ts';
          const bundle = await ensureWindowsPosixBundle(process.cwd());
          for (const relative of bundle.files) {
            const target = join('.runtime/windows-posix-release', relative);
            await mkdir(dirname(target), { recursive: true });
            await cp(relative, target);
          }
          '@ | node --import tsx --input-type=module
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notara-windows-posix
          path: .runtime/windows-posix-release/vendor/windows-posix/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notara-windows-portable
          path: |
            .runtime/portable-release/notara-portable-*-win-x64.zip
            .runtime/portable-release/notara-portable-*-win-x64.zip.sha256
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
  linux:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-vault && npm run build:pixel-classroom
      - run: npm run typecheck && npm run typecheck:tests && npm run test:unit && npm run test:plugins
      - run: npm run test:integration
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e:vault -- subscription-catalog.spec.ts chatgpt-catalog.spec.ts
  release:
    needs: [resolve, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-vault && npm run build:pixel-classroom
      - name: Reuse the verified Windows shell without another upstream download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notara-windows-posix
          path: vendor/windows-posix
      - name: Build the verified release
        env:
          NOTARA_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import { buildRelease } from './scripts/build-vault-release.ts';
          const result = await buildRelease('.runtime/release');
          if (process.env.NOTARA_RELEASE_TAG !== `v${result.version}`) throw new Error('Release tag must match the plugin version');
          console.log(`Release bundle: ${result.archive}`);
          JS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notara-windows-portable
          path: .runtime/release
      - name: Publish the completed release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARA_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$NOTARA_RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$NOTARA_RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$NOTARA_RELEASE_TAG" --draft --verify-tag --generate-notes --notes-file "docs/releases/native-vault-${NOTARA_RELEASE_TAG#v}.md" --title "Notara $NOTARA_RELEASE_TAG"
          fi
          gh release upload "$NOTARA_RELEASE_TAG" .runtime/release/notara-*.zip .runtime/release/notara-portable-*.sha256 .runtime/release/notara-update.json --clobber
          gh release edit "$NOTARA_RELEASE_TAG" --draft=false --latest
