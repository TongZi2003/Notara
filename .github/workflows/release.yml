name: Publish Notara release
on:
  push:
    tags: ['v*']
    branches: ['codex/release-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME#codex/release-}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  windows:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-vault && npm run build:pixel-classroom
      # These tests start real PowerShell ACL helpers; cold hosted runners can
      # exceed Vitest's 5 s default. Keep every assertion and a bounded deadline.
      - run: npm run test:unit -- --testTimeout=30000
      - run: npm run test:plugins
      - name: Test the real Windows sandbox and CLI
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts tests/integration/native-vault-git-bash.test.ts tests/integration/native-vault-memory.test.ts tests/integration/native-vault-teaching.test.ts tests/integration/native-vault-windows-shell.test.ts tests/integration/native-vault-windows-cli.test.ts tests/integration/native-vault-windows-pipe.test.ts
  release:
    needs: [resolve, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native-vault && npm run build:pixel-classroom
      - run: npm run typecheck && npm run typecheck:tests && npm run test:unit && npm run test:plugins
      - run: npm run test:integration
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e:vault
      - name: Build the verified release
        env:
          NOTARA_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import { buildRelease } from './scripts/build-vault-release.ts';
          const result = await buildRelease('.runtime/release');
          if (process.env.NOTARA_RELEASE_TAG !== `v${result.version}`) throw new Error('Release tag must match the plugin version');
          console.log(`Release bundle: ${result.archive}`);
          JS
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARA_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$NOTARA_RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$NOTARA_RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$NOTARA_RELEASE_TAG" --draft --verify-tag --generate-notes --notes-file "docs/releases/native-vault-${NOTARA_RELEASE_TAG#v}.md" --title "Notara $NOTARA_RELEASE_TAG"
          fi
          gh release upload "$NOTARA_RELEASE_TAG" .runtime/release/notara-*.zip .runtime/release/notara-update.json --clobber
          gh release edit "$NOTARA_RELEASE_TAG" --draft=false --latest
