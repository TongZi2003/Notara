name: Publish Notara release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run typecheck:tests && npm run test:unit && npm run test:plugins
      - run: npm run test:integration
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e:vault
      - run: npm run release:bundle
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Notara $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" .runtime/release/notara-*.zip .runtime/release/notara-update.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
