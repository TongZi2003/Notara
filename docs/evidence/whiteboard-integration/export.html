<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>课堂笔记</title><style>body{max-width:820px;margin:60px auto;padding:0 24px;color:#30343b;background:white;font:18px/1.85 "Kaiti SC",STKaiti,serif}h1,h2{line-height:1.4}section{margin:2.5em 0}mark{color:inherit;background:#dcebfa}mark[data-color=green]{background:#d9eee1}mark[data-color=orange]{background:#fae3c9}mark[data-color=pink]{background:#f6dce5}pre{white-space:pre-wrap}img{max-width:100%}a{color:#426f93}</style><body><h1>课堂笔记</h1><section><h2>从观察到解释</h2><ul><li>观察：先看发生了什么</li><li>解释：提出<mark data-color="blue">可以检验</mark>的假说</li><li>证据：用新的观察检验假说</li></ul><p><span>观察与证据</span></p></section><section><h2>建立一个模型</h2><p><strong>模型不是事实本身</strong></p><p>好的模型需要抓住共同结构。</p><p><mark data-color="green">解释范围</mark>与<mark data-color="pink">适用条件</mark>同样重要。</p><p><span>建立模型</span></p></section><section><details><summary>想一想</summary><p>一个反例，能否推翻一个规律？</p><p>先区分普遍命题和概率判断。</p></details></section></body></html>
