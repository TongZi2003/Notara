<!doctype html>
<html lang="zh-CN" data-theme="light" data-sf-style="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notara · 拾页 — 前端重设计原型</title>
<link rel="icon" href="data:,">
<!--
  Notara 前端重设计的可交互原型（设计稿，不是运行代码）。
  基线：codex/notara-vault-clean @ native-vault-v0.14.9。设计说明见 docs/ui/notara-frontend-redesign.md。
  当前只开放极简主题；手帐样式保留为后续润色素材，暂不提供切换入口。
  全部数据为合成示例；「原型」按钮里的开关只属于原型，不是产品界面。
-->
<style>
@font-face{font-family:"SF WenKai";src:url("../../packages/client/assets/notebook/fonts/wenkai.woff2") format("woff2");font-display:swap}
:root{
  --font:"Helvetica Neue",Helvetica,"Hiragino Sans GB","PingFang SC","Noto Sans SC","Microsoft YaHei UI",Arial,sans-serif;
  --serif:"Times New Roman","Songti SC",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* 纯白背景与浅灰操作面。现代主题不使用黄纸、紫色或黑色大按钮。 */
  --bg:#ffffff;--surface:#ffffff;--side:#ffffff;--soft:#f4f5f6;--hover:#eceef0;--press:#e5e7ea;
  --line:#e8ecf0;--line-2:#d8dee6;
  --ink:#20252c;--ink-2:#525c69;--ink-3:#76808c;
  --accent:#59626e;--accent-2:#343c46;--accent-soft:#f0f1f3;--on-accent:#ffffff;
  --review:#687482;--review-soft:#eef1f5;
  --lesson:#537d74;--lesson-soft:#eef5f3;
  --summary:#6c7d96;--summary-soft:#eff2f7;
  --daily:#6e7888;--daily-soft:#f0f2f5;
  --danger:#a25454;--danger-soft:#f8efef;
  --ok:#54836b;--ok-soft:#edf5f0;
  --shadow-1:0 1px 3px rgba(30,45,65,.035);
  --shadow-2:0 6px 24px rgba(30,45,65,.045),0 1px 3px rgba(30,45,65,.025);
  --r-xs:6px;--r-sm:10px;--r-ctl:14px;--r-card:20px;--r-menu:18px;--r-input:24px;
  --t-hero:32px;--t-page:22px;--t-section:16px;--t-item:15px;--t-ui:14px;--t-meta:12px;--t-read:15px;
  --g-src:var(--accent);--g-leaf:var(--surface);--g-line:var(--accent);--g-ins:var(--review);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#15181d;--surface:#1d2128;--side:#1b1f25;--soft:#242a33;--hover:#2a323e;--press:#333e4c;
  --line:#2b323d;--line-2:#3b4553;
  --ink:#edf0f4;--ink-2:#bac3cf;--ink-3:#939eac;
  --accent:#b5becb;--accent-2:#e0e5eb;--accent-soft:#2c323b;--on-accent:#18202b;
  --review:#acb8c8;--review-soft:#29323f;
  --lesson:#7cbba4;--lesson-soft:#152723;
  --summary:#a8b0b7;--summary-soft:#232729;
  --daily:#a2abb4;--daily-soft:#23272a;
  --danger:#e08b80;--danger-soft:#331e1c;
  --ok:#8dbb87;--ok-soft:#1c2a1b;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 14px 34px -18px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:var(--t-ui)/1.5 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
[hidden]{display:none!important}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 外壳 ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh;overflow:hidden}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 10px 10px;z-index:45}
.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 14px}
.brand-mark{width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:650}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.brand-name em{font-style:normal;color:var(--ink-3);margin:0 3px;font-weight:400}
.new-lesson{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow-1);font-weight:600;color:var(--ink)}
.new-lesson:hover{border-color:var(--accent);color:var(--accent)}
.nav{display:grid;gap:2px;margin:14px 0 4px}
.nav-row{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-size:14px;width:100%;white-space:nowrap}
.nav-row:hover{background:var(--hover);color:var(--ink)}
.nav-row[aria-current=page]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.nav-count{margin-left:auto;font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--review-soft);color:var(--review);display:grid;place-items:center;font-weight:650}
.side-label{font-size:12px;color:var(--ink-3);padding:16px 10px 6px}
.side-lessons{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:1px}
.lesson-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink-2);width:100%}
.lesson-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-row time{font-size:11px;color:var(--ink-3);flex:none}
.lesson-row:hover{background:var(--hover);color:var(--ink)}
.lesson-row[aria-current=page]{background:var(--press);color:var(--ink);font-weight:550}
.side-empty{padding:6px 10px;color:var(--ink-3);font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);flex:none}
.dot.live{background:var(--lesson);box-shadow:0 0 0 3px var(--lesson-soft)}
.side-foot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:grid;gap:2px}
.conn{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;padding:4px 10px;white-space:nowrap}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{display:none;align-items:center;gap:8px;height:48px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.topbar b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none}
.page{flex:1;min-height:0;overflow:auto}
.page.fill{display:flex;flex-direction:column;overflow:hidden}
.page-head{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap;flex:none}
.page-head h1{font-size:var(--t-page);font-weight:650;margin:0}
.page-head .grow{flex:1}
.page-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.page-body>*{flex:1;min-height:0}

/* ---------- 控件 ---------- */
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--soft);border:1px solid var(--line);gap:2px;flex:none}
.seg button{height:28px;padding:0 12px;border-radius:7px;color:var(--ink-2);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface);font-size:13px;color:var(--ink);white-space:nowrap;flex:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.block{width:100%}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover,.icon-btn[aria-pressed=true]{background:var(--hover);color:var(--ink)}
.icon-btn.sm{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--surface);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);white-space:nowrap;flex:none}
button.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:550}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:550;white-space:nowrap;flex:none}
.b-review{background:var(--review-soft);color:var(--review)}
.b-lesson{background:var(--lesson-soft);color:var(--lesson)}
.b-summary{background:var(--summary-soft);color:var(--summary)}
.b-daily{background:var(--daily-soft);color:var(--daily)}
.b-accent{background:var(--accent-soft);color:var(--accent)}
.b-muted{background:var(--soft);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink-3);width:240px;max-width:100%}
.search:focus-within{border-color:var(--focus,var(--accent))}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.7}
.empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}
.muted{color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
button.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}

/* ---------- 今日 ---------- */
.today{max-width:1120px;margin:0 auto;padding:40px clamp(18px,4vw,48px) 72px}
.today-date{font-size:var(--t-meta);color:var(--ink-3);letter-spacing:.02em}
.today h1{font-size:var(--t-hero);font-weight:650;margin:6px 0 20px;letter-spacing:-.01em}
.launch{border:1px solid var(--line-2);border-radius:var(--r-input);background:var(--surface);box-shadow:var(--shadow-2);padding:14px 12px 10px 18px}
.launch:focus-within{border-color:var(--focus,var(--accent))}
.launch textarea,.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15px;line-height:1.6;display:block}
.launch textarea{min-height:52px}
.bar{display:flex;align-items:center;gap:6px}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-left:auto;flex:none}
.send:hover{background:var(--accent-2)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 34px}
.today-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.today-col{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;min-width:0}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-width:0}
.panel-head h2{font-size:var(--t-section);margin:0;font-weight:650;white-space:nowrap}
.panel-head .sub{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-head .act{margin-left:auto}
.stat{display:flex;gap:24px;margin:4px 0 12px}
.stat b{font-size:26px;font-weight:650;display:block;line-height:1.15}
.stat span{font-size:12px;color:var(--ink-3)}
.rows{display:grid;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;margin:0 -8px;min-width:0;width:calc(100% + 16px)}
.row:hover{background:var(--soft)}
.row-main{flex:1;min-width:0}
.row-main b{font-weight:550;display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--soft);gap:2px;margin:8px 0 4px}
.progress i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.lesson-today{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:inset 3px 0 0 var(--lesson)}
.onboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.onboard .card{padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.onboard h3{margin:0;font-size:var(--t-item)}
.onboard p{margin:0;color:var(--ink-2);line-height:1.65;flex:1}
.step-no{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:650;font-size:12px}

/* ---------- 课堂 ---------- */
.lesson{display:flex;flex-direction:column;height:100%;min-height:0}
.lesson-head{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 24px;border-bottom:1px solid var(--line);min-height:58px;flex:none}
.lh-title{flex:1;min-width:0}
.lh-title h1{font-size:16px;font-weight:650;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh-meta{display:flex;gap:6px;margin-top:3px;flex-wrap:nowrap;overflow:hidden}
.lh-actions{display:flex;align-items:center;gap:4px;flex:none}
.lesson-body{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);position:relative}
.lesson-main{min-width:0;min-height:0;display:flex;flex-direction:column}
.chat-scroll{flex:1;min-height:0;overflow:auto}
.chat-col{max-width:760px;margin:0 auto;padding:24px 24px 8px}
.msg-user{display:flex;flex-direction:column;align-items:flex-end;margin:18px 0;gap:6px}
.msg-user .bubble{max-width:85%;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:var(--t-read);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-ai{display:flex;gap:12px;margin:18px 0}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-size:13px;font-weight:650}
.msg-ai .body{flex:1;min-width:0;font-size:var(--t-read);line-height:1.85}
.msg-ai .body p{margin:0 0 8px}
.msg-ai .who{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.msg-ai .hint{font-size:13px}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.step{margin:4px 0 4px 40px;font-size:12.5px;color:var(--ink-3)}
.step summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:2px 6px;margin-left:-6px;border-radius:6px}
.step summary::-webkit-details-marker{display:none}
.step summary:hover{background:var(--soft);color:var(--ink-2)}
.step[open] summary .ic{transform:rotate(90deg)}
.step ul{margin:4px 0 0;padding:8px 12px 8px 26px;border-left:2px solid var(--line);list-style:disc}
.worker-row{margin:10px 0 10px 40px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px}
.worker-row .row-main small{white-space:normal}
.receipt{margin:10px 0 10px 40px;border:1px solid var(--line);border-left:3px solid var(--ok);padding:10px 12px;border-radius:4px 10px 10px 4px;font-size:13px;line-height:1.9}
.receipt .badge{vertical-align:1px}
.sysrow{margin:6px 0;font-size:12px;color:var(--ink-3);font-family:var(--mono);border:1px dashed var(--line-2);padding:6px 10px;border-radius:8px}
.composer-wrap{padding:6px 24px 14px;flex:none}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--line-2);border-radius:var(--r-input);background:var(--surface);box-shadow:var(--shadow-2);padding:10px 10px 8px 16px}
.composer:focus-within{border-color:var(--focus,var(--accent))}
.composer textarea{max-height:180px;min-height:26px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.refs:empty{display:none}
.ref-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 4px 0 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;max-width:100%}
.ref-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-chip button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center}
.ref-chip button:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.msg-user .ref-chip{padding-right:8px}
.model-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:7px;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.mlabel-short{display:none}
.model-btn:hover{background:var(--hover);color:var(--ink)}
.composer-note{max-width:760px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--ink-3)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;min-height:0;overflow:auto}
.hero-inner{max-width:760px;width:100%;margin:0 auto}
.hero h2{font-size:var(--t-hero);font-weight:650;margin:0 0 6px;letter-spacing:-.01em}
.hero p{color:var(--ink-3);margin:0 0 20px}
.split-handle{cursor:col-resize;background:var(--line);position:relative;z-index:2}
.split-handle::after{content:'';position:absolute;inset:0 -4px}
.split-handle:hover,.split-handle.drag{background:var(--accent)}
.companion{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.comp-head{display:flex;align-items:center;gap:2px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);min-height:48px;flex:none}
.comp-head b{font-size:13px;margin-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-body{flex:1;min-height:0;overflow:auto}
.comp-actions{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}

/* 教室 */
.room{max-width:880px;margin:0 auto;padding:22px 24px 48px;display:grid;gap:16px}
.teacher{display:flex;gap:14px;align-items:center;padding:16px 18px}
.teacher .avatar{width:44px;height:44px;font-size:18px}
.workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.worker{padding:12px 14px;display:grid;gap:4px}
.worker b{font-size:14px}
.worker p{margin:0;color:var(--ink-3);font-size:12px;line-height:1.55}

/* ---------- 资料阅读 ---------- */
.doc{max-width:760px;margin:0 auto;padding:28px clamp(18px,4vw,44px) 64px;font-size:var(--t-read);line-height:1.85}
.doc.compact{padding:20px 20px 48px}
.doc h1{font-size:24px;margin:0 0 10px;line-height:1.35;font-weight:650}
.doc.compact h1{font-size:20px}
.doc h2{font-size:17px;margin:24px 0 6px;font-weight:650}
.doc p{margin:0 0 10px}
.doc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.doc details{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--soft);margin:8px 0}
.doc summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.doc .src-line{font-size:12.5px;color:var(--ink-3);margin:-8px 0 14px}
.doc .src-line button{color:var(--accent)}
.doc .blank{color:var(--ink-3);font-style:italic}
.m{font-family:var(--serif);font-style:italic;white-space:nowrap}
.m sub{font-size:.68em;font-style:normal;vertical-align:-.25em;line-height:0}
.pdf{background:var(--soft);min-height:100%;display:flex;flex-direction:column}
.pdf-bar{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;position:sticky;top:0;z-index:1}
.pdf-stage{padding:20px;display:flex;justify-content:center;flex:1}
.pdf-page{width:min(560px,100%);aspect-ratio:1/1.3;background:#fff;color:#222;box-shadow:0 2px 14px rgba(0,0,0,.14);padding:9% 10%;position:relative;font-family:var(--serif)}
.pdf-page h3{font-size:22px;margin:0 0 14px;font-weight:600}
.pdf-page p{font-size:13px;line-height:1.8;margin:0 0 10px}
/* 框选区域兜底值（手帐主题沿用蓝墨）；现代主题在「现代简约主题」一段覆盖为荧光标记 */
.pdf-sel{position:absolute;left:9%;top:30%;width:82%;height:22%;border:2px solid #4b5bd6;background:rgba(75,91,214,.14);border-radius:2px}
.pdf-bottom{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap;position:sticky;bottom:0}

/* ---------- 资料库 ---------- */
.lib-files{display:grid;grid-template-columns:236px minmax(0,1fr) 280px;grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.tree{border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px}
.tree-folder{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:12px;color:var(--ink-3);width:100%}
.tree-folder .ic{transition:transform .12s}
.tree-folder[aria-expanded=false] .ic{transform:rotate(-90deg)}
.tree-folder em{font-style:normal;margin-left:auto}
.tree-file{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:7px;width:100%;color:var(--ink-2);font-size:13px}
.tree-file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-file:hover{background:var(--hover);color:var(--ink)}
.tree-file[aria-current=true]{background:var(--accent-soft);color:var(--accent);font-weight:550}
.reader{overflow:auto;min-width:0}
.mobile-picker{display:none;padding:10px 16px;border-bottom:1px solid var(--line)}
.mobile-picker select{width:100%;height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:0 8px}
.inspector{border-left:1px solid var(--line);overflow:auto;padding:18px 18px 32px}
.inspector h3{font-size:12px;color:var(--ink-3);font-weight:550;margin:18px 0 8px}
.inspector h3:first-child{margin-top:0}
.props{margin:0;display:grid;gap:7px}
.props div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;font-size:12.5px;align-items:start}
.props dt{color:var(--ink-3)}
.props dd{margin:0;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.link-list{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.link-list button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:13px;color:var(--ink-2);width:100%}
.link-list button:hover{background:var(--hover);color:var(--ink)}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.filterbar{display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filterbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.cards-scroll{overflow:auto;flex:1;min-height:0}
.group-title{font-size:12px;color:var(--ink-3);padding:16px 24px 0}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:12px 24px 12px}
.kcard{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kcard h3{font-size:var(--t-item);margin:0;font-weight:600}
.kcard p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .src{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.graph-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.graph-canvas{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:20px 20px;min-height:320px}
.graph-canvas>svg{width:100%;height:100%;display:block}
.graph-legend svg{flex:none}
.g-edge{stroke:var(--ink-3);stroke-opacity:.55;stroke-width:1.3;fill:none}
.g-edge.ref{stroke-dasharray:3 4}
.g-node{cursor:pointer}
.g-hit{fill:transparent;pointer-events:all}
.g-node:focus-visible{outline:none}
.g-node:focus-visible .g-hit{stroke:var(--accent);stroke-width:2}
.g-node text{font-size:12px;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.g-node .core{fill:var(--g-src)}
.g-node .ring{fill:none;stroke:var(--g-src);stroke-width:1.6}
.g-node .hollow{fill:var(--g-leaf);stroke:var(--g-line);stroke-width:1.6}
.g-node .halo{fill:var(--g-src);opacity:.14}
.g-node .iso{fill:var(--bg);stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:2 2}
.g-node .ins{fill:var(--g-ins)}
.g-node:hover text,.g-node.sel text{fill:var(--ink);font-weight:600}
.g-node.sel .hollow,.g-node.sel .ring{stroke-width:2.6}
svg.hovering .g-node:not(.near){opacity:.25}
svg.hovering .g-edge:not(.near){stroke-opacity:.12}
.graph-tools{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.graph-tools>*{pointer-events:auto}
.graph-legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--ink-2);display:grid;grid-template-columns:auto auto;gap:4px 14px}
.graph-legend span{display:inline-flex;align-items:center;gap:6px}
.graph-detail{border-left:1px solid var(--line);overflow:auto;padding:18px}
.graph-detail h2{font-size:18px;margin:4px 0 4px}

/* ---------- 计划 ---------- */
.routes{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.route-list{border-right:1px solid var(--line);padding:14px;overflow:auto;display:grid;align-content:start;gap:8px}
.route-item{padding:12px 14px;display:grid;gap:4px;width:100%}
.route-item b{font-size:14px}
.route-item[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.route-main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.route-goal{padding:16px 24px 4px;color:var(--ink-2);line-height:1.7;max-width:900px}
.route-goal b{color:var(--ink)}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);padding:12px 12px 20px;overflow:auto;flex:1;align-content:start;background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:20px 20px}
.lane{padding:0 12px;border-left:1px dashed var(--line-2);min-width:0}
.lane:first-child{border-left:0}
.lane-title{font-size:12px;color:var(--ink-3);margin:4px 0 12px;display:flex;gap:6px;align-items:center}
.lane-title b{color:var(--ink-2);font-weight:600}
.node{width:100%;padding:12px 12px 10px;margin-bottom:10px;display:grid;gap:6px;position:relative}
.node b{font-size:14px;font-weight:600;line-height:1.4}
.node .kind{font-size:11.5px;color:var(--ink-3)}
.node.branch{border-style:dashed;width:calc(100% - 16px);margin-left:16px}
.node.branch::before{content:'';position:absolute;left:-12px;top:-10px;width:10px;height:28px;border-left:1.5px solid var(--line-2);border-bottom:1.5px solid var(--line-2);border-bottom-left-radius:6px}
.node[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node .state{display:flex;gap:6px;flex-wrap:wrap}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(360px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow-2);padding:18px 20px;overflow:auto;z-index:5}
.drawer h2{font-size:18px;margin:2px 0 6px}
.drawer .stack{margin:14px 0}
.drawer .note{font-size:12.5px;color:var(--ink-3);line-height:1.7;background:var(--soft);border-radius:8px;padding:8px 10px}
.logs{border-top:1px solid var(--line);padding:10px 24px;flex:none}
.logs summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.calendar{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.month{padding:18px 24px;overflow:auto}
.month-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.month-head b{font-size:16px;margin-right:auto}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{font-size:12px;color:var(--ink-3);padding:4px 8px}
.day{min-height:68px;border-radius:10px;border:1px solid transparent;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.day:hover{background:var(--soft)}
.day[data-out]{opacity:.4}
.day[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.dnum{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.day[data-today] .dnum{background:var(--accent);color:var(--on-accent);font-weight:650}
.ddots{display:flex;gap:3px;flex-wrap:wrap}
.ddots i{width:6px;height:6px;border-radius:50%}
.k-lesson{background:var(--lesson)}.k-log{background:var(--summary)}.k-due{background:var(--review)}.k-review{background:var(--accent)}.k-daily{background:var(--daily)}
.agenda{border-left:1px solid var(--line);padding:18px 20px;overflow:auto}
.agenda h2{font-size:17px;margin:0 0 2px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;margin:0 -8px;border-radius:8px;width:calc(100% + 16px)}
.ev:hover{background:var(--soft)}
.ev i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.review{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.review-list{border-right:1px solid var(--line);overflow:auto;padding:8px 12px 24px}
.review-item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:9px;width:100%}
.review-item:hover{background:var(--soft)}
.review-item[aria-current=true]{background:var(--accent-soft)}
.review-detail{overflow:auto;padding:22px clamp(18px,3vw,36px) 48px}
.review-detail h2{font-size:20px;margin:0 0 6px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.box h3{font-size:13px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.hist{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.hist-items{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ability{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:8px}
.ability input{height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface);outline:0;min-width:0}
.ability input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--focus,var(--accent))}
.seg.small button{height:26px;padding:0 9px;font-size:12px}

/* ---------- 浮层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,18,24,.34);display:grid;place-items:center;z-index:60;padding:20px}
.dialog{width:min(540px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2);padding:22px 24px}
.dialog h2{margin:0 0 4px;font-size:18px}
.dialog .desc{color:var(--ink-3);margin:0 0 18px;font-size:13px;line-height:1.6}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>span{font-size:12.5px;color:var(--ink-2);font-weight:550}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--surface);outline:0;width:100%}
.field textarea{resize:vertical;line-height:1.6}
.field small{color:var(--ink-3);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.radio-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.radio-cards label{position:relative;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px;cursor:pointer}
.radio-cards label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-cards label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.radio-cards input{position:absolute;opacity:0;pointer-events:none}
.radio-cards small{color:var(--ink-3);font-size:12px;line-height:1.5}
.menu{position:fixed;z-index:70;min-width:230px;max-width:340px;max-height:min(460px,calc(100vh - 24px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-menu);box-shadow:var(--shadow-2);padding:6px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink)}
.menu-item:hover{background:var(--hover)}
.menu-item small{display:block;color:var(--ink-3);font-size:11.5px}
.menu-label{font-size:11.5px;color:var(--ink-3);padding:8px 10px 4px}
.menu-sep{height:1px;background:var(--line);margin:4px 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:var(--shadow-2);max-width:calc(100vw - 40px)}
.proto{position:fixed;right:14px;bottom:14px;z-index:55;font-size:12px}
.proto>button{height:30px;padding:0 12px;border-radius:15px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:var(--shadow-2)}
.proto-panel{position:absolute;right:0;bottom:38px;width:250px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:12px;display:grid;gap:10px}
.proto-panel p{margin:0;color:var(--ink-3);line-height:1.55}

/* ---------- 现代简约：白灰、轻边界、集中构图 ---------- */
[data-sf-style=modern]{--focus:#809bbe;--mark-wash:rgb(134 165 206 / .18);--mark-line:#8ba6c9}
[data-sf-style=modern][data-theme=dark]{--focus:#a1b9d9;--mark-wash:rgb(134 165 206 / .22);--mark-line:#829fc5}
[data-sf-style=modern] :is(.brand-name,.today h1,.hero h2,.page-head h1,.panel-head h2,.lh-title h1,.doc h1,.doc h2,.dialog h2,.drawer h2,.agenda h2,.month-head b,.review-detail h2,.graph-detail h2,.kcard h3,.box h3){font-weight:600;letter-spacing:-.015em}
[data-sf-style=modern] :is(.brand-mark,.new-lesson,.btn,.stat b,.nav-row[aria-current=page],.lesson-row[aria-current=page],.nav-count,.seg button[aria-selected=true],.chip[aria-pressed=true],.badge,.row-main b,.review-item b,.avatar,.comp-head b,.node b,.route-item b){font-weight:500}
[data-sf-style=modern] :is(.stat b,.nav-count,.lesson-row time,.dnum){font-variant-numeric:tabular-nums}
[data-sf-style=modern] .app{grid-template-columns:228px minmax(0,1fr)}
[data-sf-style=modern] .side{margin:12px 0 12px 12px;padding:18px 10px 12px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-2)}
[data-sf-style=modern] .brand{padding:0 8px 22px;gap:10px}
[data-sf-style=modern] .brand-mark{width:28px;height:28px;background:transparent;color:var(--ink);border:1px solid var(--line-2);border-radius:9px}
[data-sf-style=modern] .brand-name{font-size:15px;letter-spacing:-.025em}
[data-sf-style=modern] .new-lesson{height:38px;border-radius:13px;background:var(--soft);color:var(--ink-2);border-color:transparent;box-shadow:none}
[data-sf-style=modern] .new-lesson:hover{background:var(--accent-soft);border-color:var(--line-2);color:var(--accent-2)}
[data-sf-style=modern] .nav{gap:5px;margin:22px 0 8px}
[data-sf-style=modern] .nav-row{height:40px;border-radius:12px;padding:0 12px}
[data-sf-style=modern] .nav-row[aria-current=page]{background:var(--accent-soft);color:var(--accent-2);box-shadow:none}
[data-sf-style=modern] .nav-count{background:transparent;color:inherit;font-size:12px}
[data-sf-style=modern] .side-label{padding:22px 12px 10px;font-size:11px;letter-spacing:.06em}
[data-sf-style=modern] .lesson-row{padding:10px 12px;border-radius:10px;font-size:12px}
[data-sf-style=modern] .lesson-row[aria-current=page]{background:var(--soft)}
[data-sf-style=modern] .side-foot{border:0}
[data-sf-style=modern] .conn{font-size:10px}
/* 首页先留出一个完整的输入空间，学习记录在其下方展开。 */
[data-sf-style=modern] .today{max-width:1100px;width:100%;padding:76px clamp(24px,5vw,64px) 72px}
[data-sf-style=modern] .today-date{text-align:center;letter-spacing:.04em;font-size:12px}
[data-sf-style=modern] .today h1{text-align:center;margin:14px 0 34px;line-height:1.35;letter-spacing:-.025em}
[data-sf-style=modern] .launch{max-width:720px;margin:0 auto;padding:22px 20px 16px;border-color:var(--line);box-shadow:var(--shadow-2)}
[data-sf-style=modern] .launch textarea{min-height:72px;font-size:16px;line-height:1.7}
[data-sf-style=modern] .launch textarea::placeholder,[data-sf-style=modern] .composer textarea::placeholder{color:var(--ink-3)}
[data-sf-style=modern] .quick{max-width:740px;justify-content:center;margin:18px auto 76px;gap:4px 16px}
[data-sf-style=modern] .quick .chip{border:0;background:none;padding:0 4px;color:var(--ink-3);font-size:12px;height:30px}
[data-sf-style=modern] .quick .chip:hover{color:var(--accent-2)}
[data-sf-style=modern] .today-grid{gap:44px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
[data-sf-style=modern] .today-col{gap:36px}
[data-sf-style=modern] .panel{background:none;border:0;border-radius:0;padding:0}
[data-sf-style=modern] .panel-head{margin-bottom:18px}
[data-sf-style=modern] .panel-head .sub{font-size:11px}
[data-sf-style=modern] .stat{gap:26px;margin-bottom:16px}
[data-sf-style=modern] .stat>div{display:flex;align-items:baseline;gap:7px}
[data-sf-style=modern] .stat b{font-size:24px}
[data-sf-style=modern] .stat span{font-size:11px}
[data-sf-style=modern] .today .row{padding-top:12px;padding-bottom:12px}
[data-sf-style=modern] .today .row+.row{border-top:1px solid var(--line)}
[data-sf-style=modern] .today .row-main small{margin-top:4px;font-size:11px}
[data-sf-style=modern] .today .row-main b{font-size:13px}
[data-sf-style=modern] .today .rows .btn{border:0;background:none;padding:0 4px;color:var(--accent);font-size:11px}
[data-sf-style=modern] .lesson-today{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:none}
[data-sf-style=modern] .onboard{gap:28px}
[data-sf-style=modern] .onboard .card{border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:18px 0 0}
/* 圆角服务于输入和操作；阅读内容保留平整的纸面。 */
[data-sf-style=modern] :is(.row,.icon-btn,.model-btn,.tree-file,.link-list button,.menu-item,.review-item,.ev){border-radius:var(--r-sm)}
[data-sf-style=modern] .btn{background:var(--soft);border-color:transparent;transition:background .15s,border-color .15s,color .15s}
[data-sf-style=modern] .btn:hover{background:var(--hover);border-color:transparent}
[data-sf-style=modern] .btn.ghost{background:transparent;border-color:transparent}
[data-sf-style=modern] .btn.ghost:hover{background:var(--soft)}

function reviewState(f) {
  const r = f.review; if (!r) return null;
  if (!r.learned) return { key:'pending', label:'待评估', cls:'b-muted' };
  const late = diffDays(TODAY, r.next);
  if (late >= 0) return { key:'due', label: late > 0 ? `逾期 ${late} 天` : '今日到期', cls:'b-review' };
  return { key: r.mastery >= 4 ? 'familiar' : 'learning', label:`第 ${r.mastery} 档 · ${md(r.next)}`, cls:'b-muted' };
}
function reviewCards(filter) {
  return files().filter(f => f.type === 'card' && f.review).filter(f => {
    const r = f.review;
    if (filter === 'all') return true;
    if (filter === 'pending') return !r.learned;
    if (!r.learned) return false;
    if (filter === 'due') return r.next <= TODAY;
    if (filter === 'learning') return r.mastery <= 3;
    return r.mastery >= 4;
  }).sort((a, b) => (a.review.next || '9') .localeCompare(b.review.next || '9'));
}
function nodeState(n) {
  if (n.summary) return { key:'summary', label:'有小结', cls:'b-summary' };
  if (n.lesson) return { key:'open', label:'已开课', cls:'b-lesson' };
  if (n.date) return { key:'scheduled', label:`已安排 ${md(n.date)}`, cls:'b-accent' };

}

function calendarEvents() {
  const ev = [];

  for (const f of files()) {
    if (f.type === 'lesson-summary') ev.push({ kind:'log', date:f.date, title:f.title, sub:'课堂小结', file:f.id });
    if (f.type === 'daily') ev.push({ kind:'daily', date:f.date, title:`${md(f.date)} 日记`, sub:'日记', file:f.id });
    if (f.review?.learned) ev.push({ kind:'due', date:f.review.next, title:f.title, sub:`到期复习 · 第 ${f.review.mastery} 档`, card:f.id });

}

const GRAPH = {
  pos:{ 'k-conic':[300,170], 't-chord':[470,250], 'c-midchord':[640,200], 'c-focal':[620,330], 'c-ellipse':[210,300], 'i-diff':[800,260], 'k-vector':[140,460], 'm-vector':[300,470], 'c-basis':[440,440],
    'k-seq':[820,440], 'c-telescope':[700,500], 'c-shift':[900,540], 'm-essay':[120,120], 'c-detail':[80,230], 'c-thread':[230,60], 'p-profile':[560,560], 'r-conic':[930,120] },
};
function graphData() {
  const nodes = files().filter(f => GRAPH.pos[f.id]);
  const has = id => nodes.some(n => n.id === id), edges = [];
  for (const f of nodes) {
    if (f.source && has(f.source.file)) edges.push([f.source.file, f.id, 'split']);
    if (f.parent && has(f.parent)) edges.push([f.parent, f.id, 'split']);
    for (const l of f.links || []) if (has(l)) edges.push([f.id, l, 'ref']);
  }
  edges.push(...[['k-conic', 't-chord', 'split'], ['c-basis', 'k-vector', 'ref']].filter(([a, b]) => has(a) && has(b)));
  return { nodes, edges };
}
function graphRole(id, edges) {
  const f = file(id);
  if (f.type === 'insight') return 'insight';
  const out = edges.filter(e => e[0] === id && e[2] === 'split').length, any = edges.some(e => e[0] === id || e[1] === id);
  if (!any) return 'iso';
  if (out && !edges.some(e => e[1] === id && e[2] === 'split')) return 'source';
  return out ? 'mid' : 'leaf';
}
function graphSVG(compact) {
  const { nodes, edges } = graphData();

/* ============================ 路由与主渲染 ============================ */
function parseHash() {
  const [, a, b] = (location.hash || '#/today').split('/');
  if (a === 'library') { S.route = { name:'library' }; if (['files', 'cards', 'graph'].includes(b)) S.lib.view = b; }
  else if (a === 'plan') { S.route = { name:'plan' }; if (['routes', 'calendar', 'review'].includes(b)) S.plan.view = b; }
  else if (a === 'lesson' && b) { S.route = { name:'lesson', id:b }; S.lastLesson = b; S.scrollChat = true; }
  else S.route = { name:'today' };
}
function go(hash) { if (location.hash !== hash) history.pushState(null, '', hash); parseHash(); render(); }
function titleOf() { const r = S.route; return r.name === 'today' ? '今日' : r.name === 'library' ? '资料库' : r.name === 'plan' ? '计划' : (lesson(r.id)?.title || '课堂'); }
function render() {
  WB.capture();
  const focus = document.activeElement, fid = focus && focus.id, sel = fid && 'selectionStart' in focus ? [focus.selectionStart, focus.selectionEnd] : null;
  document.documentElement.dataset.theme = S.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme;
  document.documentElement.dataset.sfStyle = S.style;
  $('#app').toggleAttribute('data-side-open', S.sideOpen);
  $('#side').innerHTML = sideHTML();
  const r = S.route.name;
  const content = r === 'today' ? `<div class="page">${todayHTML()}</div>` : r === 'library' ? libraryHTML() : r === 'plan' ? planHTML() : lessonHTML(S.route.id);
  $('#main').innerHTML = `<div class="topbar"><button class="icon-btn" ${act('side-open')} aria-label="打开导航">${icon('menu')}</button><b>${esc(titleOf())}</b>${r === 'lesson' ? `<button class="icon-btn" ${act('companion-toggle')} aria-label="资料面板">${icon('split')}</button>` : ''}</div>${content}`;
  document.title = `${titleOf()} · Notara · 拾页`;
  $('#proto').innerHTML = `<button ${act('proto')} aria-expanded="${S.protoOpen}">原型</button>${S.protoOpen ? `<div class="proto-panel"><b>原型控制</b><p>只属于原型，不是产品界面。</p>
    <div class="seg small"><button aria-selected="${!S.empty}" ${act('proto-empty', '0')}>示例数据</button><button aria-selected="${S.empty}" ${act('proto-empty', '1')}>空白学习空间</button></div>
    <div class="seg small"><button aria-selected="${S.theme === 'light'}" ${act('theme', 'light')}>浅色</button><button aria-selected="${S.theme === 'dark'}" ${act('theme', 'dark')}>深色</button><button aria-selected="${S.theme === 'system'}" ${act('theme', 'system')}>跟随系统</button></div>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${S.debug ? 'checked' : ''} data-bind="debug">调试模式</label></div>` : ''}`;
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.body) { el.focus({ preventScroll:true }); if (sel && 'setSelectionRange' in el) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* not a text input */ } } }
  const chat = $('#chat-scroll'); if (chat && S.scrollChat) { chat.scrollTop = chat.scrollHeight; S.scrollChat = false; }
  document.querySelectorAll('textarea[data-draft]').forEach(grow);
  WB.restore();
}
function grow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }

/* ============================ 行为 ============================ */
function createLesson(opts = {}) {
  const id = 'n' + (++S.created);
  const L = { id, title:opts.title || '新的一课', when:'刚刚', live:true, route:opts.route, node:opts.node, settings:{ goal:'', method:'socratic', subject:'', deadline:'', minutes:'', note:'', persona:'' }, messages:[] };
  LESSONS.forEach(l => { l.live = false; }); LESSONS.unshift(L); return L;
}
function sendMessage(id, text) {
  const L = lesson(id), refs = S.refs[id] || [];
  if (!L || (!text.trim() && !refs.length)) return;
  L.messages.push({ role:'user', text:text.trim(), refs:[...refs] });
  if (L.title === '新的一课') L.title = (text.trim() || refs[0].label).replace(/\s+/g, ' ').slice(0, 18);
  S.refs[id] = []; S.drafts[id] = ''; L.typing = true; L.when = '刚刚'; S.scrollChat = true;
  LESSONS.forEach(l => { l.live = l === L; });
  render();
  setTimeout(() => {
    L.typing = false; S.scrollChat = true;
    const card = refs.map(r => file(r.file)).find(f => f && f.review);
    L.messages.push({ role:'ai', html: card
      ? `<p>好，我们来复习《${esc(card.title)}》。先别看卡片——试着自己说说这类题的第一步是什么？</p><p class="hint">这次我会优先看上次“尚未观察”的那项能力，提示不会让你“扣分”。</p>`
      : `<p>收到。我先看看你的思路：你已经试过什么？卡在哪一步？</p><p class="hint">我会从你能自己动手的那一步开始，不会直接给答案。</p>` });
    if (S.route.name === 'lesson' && S.route.id === id) render(); else { render(); toast(`「${L.title}」老师已回复`); }
  }, 900);
}
function addRef(lessonId, fid, label, intent) {
  const f = file(fid); const ref = { file:fid, label:label || fileLabel(f) };
  const list = S.refs[lessonId] = S.refs[lessonId] || [];
  if (!list.some(r => r.file === ref.file && r.label === ref.label)) list.push(ref);
  if (intent === 'review') S.drafts[lessonId] = '请围绕这张卡片带我回忆或练习，先让我尝试，不要提前展示答案。';
  if (intent === 'route') S.drafts[lessonId] = '请结合真实学习记录检查这份路线的目标、顺序、先修和练习安排，按需要局部调整未来课程，保留已开展课堂与原有记录。';
}
function startNode(arg) {
  const [rid, nid, again] = arg.split(':'), r = route(rid), n = r.nodes.find(x => x.id === nid);
  if (n.lesson && !again) return go('#/lesson/' + n.lesson);
  const L = createLesson({ title:(again ? '再学：' : '') + n.title, route:rid, node:nid });
  if (!again) n.lesson = L.id;
  L.settings.goal = n.title; S.plan.node = null;
  go('#/lesson/' + L.id);
}
function recordReview(f) {
  const F = S.reviewForm, items = F.items.map(x => [x.ability.trim(), x.outcome]), r = f.review, before = { ...r };
  const need = items.some(x => x[1] === 'needs_practice'), all = items.every(x => x[1] === 'demonstrated');
  let changed = false;
  if (need) { r.mastery = r.learned ? Math.max(1, r.mastery - 1) : 1; r.learned = true; r.next = addDays(TODAY, INTERVALS[r.mastery - 1]); changed = true; }
  else if (all && !r.learned) { r.learned = true; r.mastery = 1; r.next = addDays(TODAY, 1); changed = true; }
  else if (all && TODAY >= r.next) { r.mastery = Math.min(5, r.mastery + 1); r.next = addDays(TODAY, INTERVALS[r.mastery - 1]); changed = true; }
  f.history.unshift({ date:TODAY, actor:'自评', items, note:F.note.trim(), before, after:{ ...r } });
  S.reviewForm = null;
  toast(changed ? '已保存能力评估并更新复习安排。' : '已保存能力评估，原复习安排保持不变。');
}
function setBind(key, value) {
  if (key === 'debug') S.debug = value;
  else if (key === 'lib.group') S.lib.group = value;
  else if (key.startsWith('lib.')) S.lib[key.slice(4)] = value;
}

  if (kind === 'launch') { const text = form.text.value; if (!text.trim()) return form.text.focus(); S.drafts.launch = ''; const L = createLesson(); go('#/lesson/' + L.id); sendMessage(L.id, text); }
  else if (kind === 'send') sendMessage(form.dataset.arg, form.text.value);
  else if (kind === 'teaching') { const L = lesson(form.dataset.arg), d = new FormData(form); const m = String(d.get('minutes') || '').trim();
    if (m && (!/^\d+$/.test(m) || Number(m) > 1440)) return toast(Number(m) > 1440 ? '每天学习时长最多 1440 分钟。' : '每天学习时长请填整数分钟。');
    Object.assign(L.settings, { goal:d.get('goal'), deadline:d.get('deadline'), minutes:m, subject:d.get('subject'), method:d.get('method'), note:d.get('note'), persona:d.get('persona') });
    closeLayer(); toast('已保存，下一次提问就会用上新设置。'); render(); }
  else if (kind === 'review') { const f = file(S.plan.sel); if (f) { recordReview(f); render(); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft) { S.drafts[t.dataset.draft] = t.value; grow(t); return; }
  if (t.id === 'launch-input') { S.drafts.launch = t.value; return; }
  if (t.dataset.ability !== undefined) { S.reviewForm.items[Number(t.dataset.ability)].ability = t.value; updateReviewReady(); return; }
  if (t.dataset.reviewNote !== undefined) { S.reviewForm.note = t.value; updateReviewReady(); return; }
  if (t.dataset.bind === 'lib.query') { S.lib.query = t.value; render(); }
});
function updateReviewReady() { const F = S.reviewForm, b = $('[data-form="review"] [type=submit]'); if (b) b.disabled = !(F.note.trim() && F.items.every(x => x.ability.trim()) && new Set(F.items.map(x => x.ability.trim())).size === F.items.length); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind && t.dataset.bind !== 'lib.query') { setBind(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value); const open = $('.overlay'); render(); if (open && t.dataset.bind === 'debug') A['app-settings'](); }
  if (t.dataset.nodeDate) { const [rid, nid] = t.dataset.nodeDate.split(':'); route(rid).nodes.find(n => n.id === nid).date = t.value || undefined; toast(t.value ? '已安排课程。' : '已清除日期。'); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#layer').innerHTML) closeLayer(); else if (S.sideOpen) { S.sideOpen = false; render(); } return; }
  const t = e.target;
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && (t.dataset.draft || t.id === 'launch-input')) { e.preventDefault(); t.form.requestSubmit(); }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('g[data-act]')) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles:true })); }
  if (t.classList.contains('split-handle') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { S.split = Math.max(28, Math.min(70, S.split + (e.key === 'ArrowLeft' ? 4 : -4))); render(); $('.split-handle')?.focus(); }
});
document.addEventListener('mouseover', e => {
  const g = e.target.closest('g[data-gnode]'), svg = e.target.closest('svg[data-graph]');
  document.querySelectorAll('svg.hovering').forEach(s => { if (s !== svg || !g) { s.classList.remove('hovering'); s.querySelectorAll('.near').forEach(x => x.classList.remove('near')); } });
  if (!g || !svg) return;
  const id = g.dataset.gnode; svg.classList.add('hovering'); g.classList.add('near');
  svg.querySelectorAll('line').forEach(l => { if (l.dataset.a === id || l.dataset.b === id) { l.classList.add('near'); svg.querySelector(`[data-gnode="${l.dataset.a === id ? l.dataset.b : l.dataset.a}"]`)?.classList.add('near'); } });
});
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.split-handle'); if (!h) return;
  const body = h.parentElement, rect = body.getBoundingClientRect(); h.classList.add('drag'); h.setPointerCapture(e.pointerId);
  const move = ev => { S.split = Math.max(28, Math.min(70, (rect.right - ev.clientX) / rect.width * 100)); body.style.gridTemplateColumns = `minmax(0,${100 - S.split}fr) 1px minmax(0,${S.split}fr)`; };
  const up = () => { h.classList.remove('drag'); h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system') render(); });
window.addEventListener('hashchange', () => { parseHash(); render(); });
window.addEventListener('popstate', () => { parseHash(); render(); });
WB.install(A);
parseHash(); render();
</script>
