<style>
main{max-width:720px;margin:auto}header{margin-bottom:20px}h1{margin:0 0 4px}p{margin:0;color:var(--notara-muted)}.topic{display:grid;gap:6px;margin-bottom:24px}.topic input{width:100%}ol{list-style:none;margin:0;padding:0}li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-bottom:24px;position:relative}li:not(:last-child):before{content:'';position:absolute;left:12px;top:26px;bottom:0;border-left:1px solid var(--notara-border)}.number{font-variant-numeric:tabular-nums;color:var(--notara-accent);padding-top:3px;font-size:.88em}label{display:grid;gap:7px}label small{color:var(--notara-muted);font-weight:400;font-size:.86em}textarea{width:100%;min-height:100px;line-height:1.8}footer{border-top:1px solid var(--notara-border);padding-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}footer p{width:100%;font-size:.88em}.primary{color:var(--notara-accent)}@media(max-width:350px){li{grid-template-columns:20px minmax(0,1fr);gap:6px}li:not(:last-child):before{left:8px}}
</style>
<main><header><h1>论证工作台</h1><p>让每一个理由都有着落。</p></header><label class="topic">讨论主题<input id="title" placeholder="例如：增加例题一定能提高学习效果吗？" maxlength="160"></label>
<ol><li><span class="number">01</span><label>观点<small>我主张什么？在哪个范围内成立？</small><textarea id="claim"></textarea></label></li><li><span class="number">02</span><label>证据与理由<small>哪些事实支持它？出处在哪里？</small><textarea id="evidence"></textarea></label></li><li><span class="number">03</span><label>反例与疑问<small>什么情况会让这条论证站不住？</small><textarea id="counter"></textarea></label></li><li><span class="number">04</span><label>修订后的结论<small>保留什么、收窄什么、还需验证什么？</small><textarea id="revision"></textarea></label></li></ol>
<footer><button id="draft">保存草稿</button><button id="save" class="primary">整理为笔记</button><p id="status" role="status">正在读取草稿…</p></footer></main>
<script>
const ids=['title','claim','evidence','counter','revision'],$=id=>document.getElementById(id);let ready=false,busy=false;const read=()=>Object.fromEntries(ids.map(id=>[id,$(id).value]));
for(const id of ids)$(id).oninput=()=>{$('status').textContent='有未保存的草稿';};
$('draft').onclick=async()=>{if(!ready||busy)return;busy=true;$('draft').disabled=true;const data=read();$('status').textContent='正在保存…';try{await Notara.saveDraft(data);$('status').textContent=JSON.stringify(data)===JSON.stringify(read())?'草稿已保存':'先前草稿已保存，仍有新修改';}catch(e){$('status').textContent=e.message;}finally{busy=false;$('draft').disabled=false;}};
$('save').onclick=()=>{const data=read();if(!data.title.trim()||!data.claim.trim()){$('status').textContent='请填写主题与观点。';return;}Notara.saveNote({title:data.title.trim(),body:[['观点','claim'],['证据与理由','evidence'],['反例与疑问','counter'],['修订后的结论','revision']].filter(([,id])=>data[id].trim()).map(([heading,id])=>'## '+heading+'\n\n'+data[id].trim()).join('\n\n')});};Notara.onSaved(({title})=>{$('status').textContent='已保存：'+title;});
async function init(){try{const data=await Notara.loadDraft();for(const id of ids)if(typeof data?.[id]==='string')$(id).value=data[id];$('status').textContent=data?'已恢复本课草稿':'草稿只保存在本课';ready=true;}catch(e){$('status').textContent=e.message;}$('draft').disabled=!ready;}init();
</script>
