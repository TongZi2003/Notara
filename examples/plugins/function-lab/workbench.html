<style>
main{max-width:860px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0}select{max-width:100%}.equation{margin:14px 0 4px;font-variant-numeric:tabular-nums}.plot{position:relative;margin:12px 0;background:var(--notara-surface);border:1px solid var(--notara-border);border-radius:var(--notara-radius);overflow:hidden}svg{display:block;width:100%;aspect-ratio:6/5}.axis{stroke:var(--notara-muted);stroke-width:1}.grid{stroke:var(--notara-border);stroke-width:.7}svg text{fill:var(--notara-muted);font-size:13px;font-family:var(--notara-font)}.curve{fill:none;stroke:var(--notara-accent);stroke-width:2.5}.reference{fill:none;stroke:var(--notara-muted);stroke-width:1.5;stroke-dasharray:6 5}.plot-cover{position:absolute;inset:0;display:grid;place-content:center;background:var(--notara-background);text-align:center;padding:20px}.plot-cover p{margin:0 0 12px;color:var(--notara-muted)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin:18px 0}.control label{display:flex;justify-content:space-between}.control input{width:100%;accent-color:var(--notara-accent);padding:0}.meta{color:var(--notara-muted);font-size:.88em;margin:4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.writing{margin-top:22px;display:grid;gap:14px}.writing label{display:grid;gap:5px}textarea{width:100%;min-height:82px}footer{margin-top:16px}button.primary{color:var(--notara-accent)}[hidden]{display:none!important}@media(min-width:650px){.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}.writing{margin-top:12px}}@media(max-width:320px){.controls{grid-template-columns:1fr}}
</style>
<main><header><h1>函数实验台</h1><select id="family" aria-label="函数类型"><option value="quadratic">二次函数</option><option value="sine">正弦函数</option></select></header>
<div class="layout"><section aria-label="函数图像与参数"><p class="equation" id="equation"></p><div class="plot"><svg id="plot" viewBox="0 0 480 400" role="img" aria-label="函数图像"><defs><clipPath id="clip"><rect width="480" height="400"/></clipPath></defs><g id="grid"></g><g clip-path="url(#clip)"><path id="reference" class="reference"/><path id="curve" class="curve"/></g></svg><div class="plot-cover" id="cover"><p>先写下预测，再观察图像</p><button id="reveal">显示图像</button></div></div><p class="meta">x：−6 至 6 · y：−5 至 5 · 角度单位：弧度</p><div class="controls" id="controls"></div><div class="actions"><button id="pin">固定参照</button><button id="reset">重置参数</button><button id="hide">收起图像</button></div></section>
<section class="writing" aria-label="实验记录"><label>我的预测<textarea id="prediction" placeholder="只改变一个参数，图像会怎样变化？"></textarea></label><label>观察与解释<textarea id="observation" placeholder="实际发生了什么？与预测是否一致？"></textarea></label><label>下一次验证<textarea id="question" placeholder="再试哪个值，或检验哪个边界？"></textarea></label><footer><div class="actions"><button id="draft">保存草稿</button><button class="primary" id="note">整理为笔记</button></div><p class="meta" id="status" role="status">正在读取草稿…</p></footer></section></div></main>
<script>
const $=id=>document.getElementById(id);let state={family:'quadratic',a:1,b:1,h:0,k:0,shown:false,prediction:'',observation:'',question:'',reference:null};let ready=false,busy=false;
const clamp=(x,min,max,fallback)=>typeof x==='number'&&Number.isFinite(x)?Math.max(min,Math.min(max,x)):fallback;
function normalize(s){return {family:s?.family==='sine'?'sine':'quadratic',a:clamp(s?.a,-3,3,1),b:clamp(s?.b,.5,3,1),h:clamp(s?.h,-4,4,0),k:clamp(s?.k,-4,4,0),shown:s?.shown===true,prediction:typeof s?.prediction==='string'?s.prediction.slice(0,10000):'',observation:typeof s?.observation==='string'?s.observation.slice(0,10000):'',question:typeof s?.question==='string'?s.question.slice(0,10000):'',reference:null};}
function fn(s,x){return s.family==='sine'?s.a*Math.sin(s.b*(x-s.h))+s.k:s.a*(x-s.h)**2+s.k;}
function path(s){return Array.from({length:601},(_,i)=>{const x=-6+i/50,y=fn(s,x);return(i?'L':'M')+((x+6)*40).toFixed(2)+','+(200-y*40).toFixed(2)}).join(' ');}
function equation(s){const x=s.h===0?'x':`(x ${s.h<0?'+':'−'} ${Math.abs(s.h)})`,k=s.k===0?'':` ${s.k<0?'−':'+'} ${Math.abs(s.k)}`;return s.family==='sine'?`y = ${s.a} sin(${s.b}${x})${k}`:`y = ${s.a}${x}²${k}`;}
function draw(){ $('equation').textContent=equation(state);$('curve').setAttribute('d',path(state));$('reference').setAttribute('d',state.reference?path(state.reference):'');$('cover').hidden=state.shown;$('plot').setAttribute('aria-label',equation(state)); }
function dirty(){if(ready)$('status').textContent='有未保存的草稿';}
function controls(){ $('controls').replaceChildren();for(const [key,min,max,step] of [['a',-3,3,.1],['b',.5,3,.1],['h',-4,4,.1],['k',-4,4,.1]]){if(key==='b'&&state.family!=='sine')continue;const wrap=document.createElement('div');wrap.className='control';const label=document.createElement('label'),output=document.createElement('output'),input=document.createElement('input');label.htmlFor='parameter-'+key;label.textContent=key;output.textContent=state[key];label.append(output);input.type='range';input.id='parameter-'+key;input.min=min;input.max=max;input.step=step;input.value=state[key];input.setAttribute('aria-label','参数 '+key);input.oninput=()=>{state[key]=Number(input.value);output.textContent=state[key];draw();dirty();};wrap.append(label,input);$('controls').append(wrap);} }
const ns='http://www.w3.org/2000/svg';for(let x=-6;x<=6;x++){const line=document.createElementNS(ns,'line');line.setAttribute('x1',(x+6)*40);line.setAttribute('x2',(x+6)*40);line.setAttribute('y2','400');line.setAttribute('class',x===0?'axis':'grid');$('grid').append(line);if(x&&x%2===0&&Math.abs(x)<6){const t=document.createElementNS(ns,'text');t.setAttribute('x',(x+6)*40+3);t.setAttribute('y','216');t.textContent=x;$('grid').append(t);}}for(let y=-5;y<=5;y++){const l=document.createElementNS(ns,'line');l.setAttribute('y1',200-y*40);l.setAttribute('y2',200-y*40);l.setAttribute('x2','480');l.setAttribute('class',y===0?'axis':'grid');$('grid').append(l);if(y&&y%2===0){const t=document.createElementNS(ns,'text');t.setAttribute('x','246');t.setAttribute('y',196-y*40);t.textContent=y;$('grid').append(t);}}
function read(){for(const id of ['prediction','observation','question'])state[id]=$(id).value;return {...state};}
for(const id of ['prediction','observation','question'])$(id).oninput=dirty;
$('family').onchange=()=>{state.family=$('family').value;state.reference=null;controls();draw();dirty();};$('reveal').onclick=()=>{state.shown=true;draw();dirty();};$('hide').onclick=()=>{state.shown=false;draw();dirty();};$('pin').onclick=()=>{state.reference={...state,reference:null};state.shown=true;draw();dirty();};$('reset').onclick=()=>{Object.assign(state,{a:1,b:1,h:0,k:0,reference:null});controls();draw();dirty();};
$('draft').onclick=async()=>{if(!ready||busy)return;busy=true;$('draft').disabled=true;const value=read();$('status').textContent='正在保存…';try{await Notara.saveDraft(value);$('status').textContent=JSON.stringify(read())===JSON.stringify(value)?'草稿已保存':'先前草稿已保存，仍有新修改';}catch(e){$('status').textContent=e.message;}finally{busy=false;$('draft').disabled=false;}};
$('note').onclick=()=>{read();if(!state.prediction.trim()&&!state.observation.trim()&&!state.question.trim()){$('status').textContent='先写下一项预测、观察或疑问。';return;}Notara.saveNote({title:'函数实验：'+(state.family==='sine'?'正弦函数':'二次函数'),body:'## 实验参数\n\n'+equation(state)+'\n\n'+[['预测',state.prediction],['观察与解释',state.observation],['下一次验证',state.question]].filter(([,v])=>v.trim()).map(([h,v])=>'## '+h+'\n\n'+v).join('\n\n')});};Notara.onSaved(({title})=>{$('status').textContent='已保存：'+title;});
async function init(){try{const saved=await Notara.loadDraft();state=normalize(saved);if(saved?.reference)state.reference=normalize(saved.reference);$('family').value=state.family;for(const id of ['prediction','observation','question'])$(id).value=state[id];$('status').textContent=saved?'已恢复本课草稿':'草稿只保存在本课';ready=true;}catch(e){$('status').textContent=e.message;}$('draft').disabled=!ready;controls();draw();}init();
</script>
